# pull_request だけで動かす。ほかのイベントと同じファイルに置くと、
# 別のイベントで起きた実行で "autopilot QA" が skipped になり、
# 必須のチェックとして通ってしまう
name: autopilot-qa

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  qa:
    name: autopilot QA
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.event.pull_request.head.ref, 'autopilot/')
      && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: autopilot-qa-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # トークンは、PR のコードを動かす前に作る。秘密鍵はこの後の step に渡さない
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      # ツールは、PR ではなくデフォルトブランチのファイルで入れる。
      # PR の mise.toml の [env]・[hooks]・exec は PR の書いた処理を動かせるため、ツールを入れる step と shim (PATH に足さない) では動かさない。
      # ただし mise-action は、後の step に MISE_TRUSTED_CONFIG_PATHS (ワークスペース) と MISE_YES=1 を渡し、CI=true でもあるので、PR の checkout の後に mise を呼ぶと PR の mise.toml は信頼されて動く
      # そのため、PR が mise.toml でツールの版を変えても、QA はデフォルトブランチの版で動く
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      # リポジトリが固定したツール (bun・uv・task など) を入れる。shim は PATH に足さない
      # (shim があると、PR のフォルダで mise の管理するツールを呼ぶたびに、PR の mise.toml が読まれて動く。ツールの PATH は export_path で足される)
      - name: ツールを入れる (mise)
        if: hashFiles('mise.toml', '.mise.toml') != ''
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          add_shims_to_path: false
      - if: hashFiles('mise.toml', '.mise.toml') == '' && hashFiles('bun.lock', 'bun.lockb') != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - if: hashFiles('mise.toml', '.mise.toml') == '' && hashFiles('uv.lock') != ''
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # ref を指定せず、マージした結果 (refs/pull/N/merge) を検査する。
      # マージ後の動きを確かめられ、head の SHA を直接 checkout しない
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false
      # qa.start は、アプリを background で起動して、すぐ終わるコマンドにする
      - name: アプリを起動する
        run: |
          {{QA_START}}
      - uses: theindiehacker/autopilot-plugin/actions/claude@{{AUTOPILOT_REF}}
        with:
          mode: qa
          github-token: ${{ steps.app.outputs.token }}
          app-slug: ${{ steps.app.outputs.app-slug }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          pr: ${{ github.event.pull_request.number }}
