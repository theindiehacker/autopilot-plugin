name: autopilot

on:
  # 見回りだけを動かす。マージ・ラベル・対応・デプロイは、開発のルーティンと各リポジトリのデプロイのワークフローが行う
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    # 見回りを重ねて動かさない (同じ PR に起こすコメントを 2 回書かないため)。動いている見回りは止めない
    concurrency:
      group: autopilot-sweep
      cancel-in-progress: false
    steps:
      - uses: theindiehacker/autopilot-plugin/actions/autopilot@{{AUTOPILOT_REF}}
        with:
          command: sweep
          app-id: ${{ secrets.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}
