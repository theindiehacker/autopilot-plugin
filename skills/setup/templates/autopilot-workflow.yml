name: autopilot

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, closed]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  issues:
    types: [labeled]
  workflow_run:
    # 設定の CI の名前に合わせる。このワークフロー自身 (autopilot) も入れる
    workflows: [autopilot, CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: 対応する PR の番号
        required: false
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read

jobs:
  irreversible:
    if: >-
      (github.event_name == 'pull_request_target'
        && github.event.action != 'labeled' && github.event.action != 'closed')
      || github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    concurrency:
      group: autopilot-irreversible-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # pull_request_target なので、PR のコードは checkout しない
      - uses: theindiehacker/autopilot-plugin/actions/autopilot@{{AUTOPILOT_REF}}
        with:
          command: irreversible
          app-id: ${{ secrets.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}
          slack-webhook-url: ${{ secrets.AUTOPILOT_SLACK_WEBHOOK_URL }}

  automerge:
    if: >-
      github.event_name == 'pull_request_target'
      && contains(fromJSON('["opened", "reopened", "ready_for_review"]'), github.event.action)
    runs-on: ubuntu-latest
    steps:
      - uses: theindiehacker/autopilot-plugin/actions/autopilot@{{AUTOPILOT_REF}}
        with:
          command: automerge
          app-id: ${{ secrets.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}
          slack-webhook-url: ${{ secrets.AUTOPILOT_SLACK_WEBHOOK_URL }}

  label:
    if: >-
      github.event_name == 'issue_comment'
      || github.event_name == 'issues'
      || (github.event_name == 'pull_request_target' && github.event.action == 'labeled')
    runs-on: ubuntu-latest
    steps:
      - uses: theindiehacker/autopilot-plugin/actions/autopilot@{{AUTOPILOT_REF}}
        with:
          command: label
          app-id: ${{ secrets.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}
          slack-webhook-url: ${{ secrets.AUTOPILOT_SLACK_WEBHOOK_URL }}

  qa:
    name: autopilot QA
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.event.pull_request.head.ref, 'autopilot/')
      && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false
      - name: アプリを起動する
        run: |
          {{QA_START}}
      - uses: theindiehacker/autopilot-plugin/actions/claude@{{AUTOPILOT_REF}}
        with:
          mode: qa
          app-id: ${{ secrets.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          pr: ${{ github.event.pull_request.number }}

  fix:
    if: >-
      (github.event_name == 'pull_request_review'
        && github.event.action == 'submitted'
        && github.event.review.state == 'changes_requested')
      || (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'failure')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: autopilot-fix-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.pr }}
      cancel-in-progress: false
    steps:
      - id: round
        uses: theindiehacker/autopilot-plugin/actions/autopilot@{{AUTOPILOT_REF}}
        with:
          command: fix-round
          app-id: ${{ secrets.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}
          slack-webhook-url: ${{ secrets.AUTOPILOT_SLACK_WEBHOOK_URL }}
      - id: app
        if: steps.round.outputs.run == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}
      # fix-round が、同じリポジトリの autopilot の PR だと確かめている
      - id: head
        if: steps.round.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ steps.round.outputs.pr }}
        run: echo "ref=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefName --jq .headRefName)" >> "$GITHUB_OUTPUT"
      - if: steps.round.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}
          ref: ${{ steps.head.outputs.ref }}
          persist-credentials: false
      - if: steps.round.outputs.run == 'true'
        uses: theindiehacker/autopilot-plugin/actions/claude@{{AUTOPILOT_REF}}
        with:
          mode: fix
          app-id: ${{ secrets.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          pr: ${{ steps.round.outputs.pr }}
      - if: steps.round.outputs.run == 'true'
        uses: theindiehacker/autopilot-plugin/actions/autopilot@{{AUTOPILOT_REF}}
        with:
          command: ready
          app-id: ${{ secrets.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}
          slack-webhook-url: ${{ secrets.AUTOPILOT_SLACK_WEBHOOK_URL }}

  sweep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: theindiehacker/autopilot-plugin/actions/autopilot@{{AUTOPILOT_REF}}
        with:
          command: sweep
          app-id: ${{ secrets.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}
          slack-webhook-url: ${{ secrets.AUTOPILOT_SLACK_WEBHOOK_URL }}

  deploy:
    if: >-
      github.event_name == 'pull_request_target'
      && github.event.action == 'closed'
      && github.event.pull_request.merged == true
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.event.pull_request.head.ref, 'autopilot/')
    runs-on: ubuntu-latest
    concurrency:
      group: autopilot-deploy
      cancel-in-progress: false
    steps:
      - uses: theindiehacker/autopilot-plugin/actions/autopilot@{{AUTOPILOT_REF}}
        with:
          command: deploy
          app-id: ${{ secrets.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}
          slack-webhook-url: ${{ secrets.AUTOPILOT_SLACK_WEBHOOK_URL }}
