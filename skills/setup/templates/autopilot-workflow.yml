name: autopilot

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, closed]
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created]
  issues:
    types: [labeled]
  workflow_run:
    # リポジトリの CI のワークフロー名と autopilot-qa (setup が入れる)。
    # Terraform の plan を使うなら、その名前もここに入れる
    workflows: {{CI_WORKFLOWS}}
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: 対応する PR の番号
        required: false
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read

jobs:
  irreversible:
    if: >-
      (github.event_name == 'pull_request_target'
        && github.event.action != 'labeled' && github.event.action != 'closed')
      || (github.event_name == 'pull_request_review'
        && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    concurrency:
      group: autopilot-irreversible-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # pull_request_target なので、PR のコードは checkout しない
      - uses: theindiehacker/autopilot-plugin/actions/autopilot@{{AUTOPILOT_REF}}
        with:
          command: irreversible
          profile: irreversible
          app-id: ${{ secrets.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}
          slack-webhook-url: ${{ secrets.AUTOPILOT_SLACK_WEBHOOK_URL }}

  # TERRAFORM_PLAN:BEGIN (Terraform の plan が無いリポジトリでは、setup がこの job ごと消す)
  irreversible-plan:
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.name == '{{TERRAFORM_PLAN_WORKFLOW}}'
    runs-on: ubuntu-latest
    concurrency:
      group: autopilot-irreversible-plan-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha }}
      cancel-in-progress: true
    steps:
      - uses: theindiehacker/autopilot-plugin/actions/autopilot@{{AUTOPILOT_REF}}
        with:
          command: irreversible
          profile: irreversible
          app-id: ${{ secrets.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}
          slack-webhook-url: ${{ secrets.AUTOPILOT_SLACK_WEBHOOK_URL }}
  # TERRAFORM_PLAN:END

  automerge:
    if: >-
      github.event_name == 'pull_request_target'
      && contains(fromJSON('["opened", "reopened", "ready_for_review"]'), github.event.action)
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.event.pull_request.head.ref, 'autopilot/')
    runs-on: ubuntu-latest
    steps:
      - uses: theindiehacker/autopilot-plugin/actions/autopilot@{{AUTOPILOT_REF}}
        with:
          command: automerge
          app-id: ${{ secrets.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}
          slack-webhook-url: ${{ secrets.AUTOPILOT_SLACK_WEBHOOK_URL }}

  label:
    if: >-
      (github.event_name == 'issue_comment'
        && contains(github.event.comment.body, '<!-- autopilot:needs-human -->')
        && (github.event.comment.user.type == 'Bot'
          || contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)))
      || (github.event_name == 'issues'
        && github.event.label.name == 'needs-human')
      || (github.event_name == 'pull_request_target'
        && github.event.action == 'labeled'
        && github.event.label.name == 'needs-human')
    runs-on: ubuntu-latest
    steps:
      - uses: theindiehacker/autopilot-plugin/actions/autopilot@{{AUTOPILOT_REF}}
        with:
          command: label
          app-id: ${{ secrets.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}
          slack-webhook-url: ${{ secrets.AUTOPILOT_SLACK_WEBHOOK_URL }}

  fix:
    if: >-
      (github.event_name == 'pull_request_review'
        && github.event.action == 'submitted'
        && github.event.review.state == 'changes_requested'
        && github.event.pull_request.head.repo.full_name == github.repository
        && (github.event.review.user.type == 'Bot'
          || contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association)))
      || (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'failure'
        && github.event.workflow_run.head_repository.full_name == github.repository
        && github.event.workflow_run.name != '{{TERRAFORM_PLAN_WORKFLOW}}')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      run: ${{ steps.round.outputs.run }}
    concurrency:
      group: autopilot-fix-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.pr }}
      cancel-in-progress: false
    steps:
      - id: round
        uses: theindiehacker/autopilot-plugin/actions/autopilot@{{AUTOPILOT_REF}}
        with:
          command: fix-round
          app-id: ${{ secrets.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}
          slack-webhook-url: ${{ secrets.AUTOPILOT_SLACK_WEBHOOK_URL }}
      - if: steps.round.outputs.run == 'true' && steps.round.outputs.ref == ''
        run: |
          echo "::error::PR のブランチ名が取れませんでした"
          exit 1
      # トークンは、PR のコードを動かす前に作る。秘密鍵はこの後の step に渡さない
      - id: app
        if: steps.round.outputs.run == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-actions: read
      # fix-round が、同じリポジトリの autopilot の PR だと確かめている
      - if: steps.round.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}
          ref: ${{ steps.round.outputs.ref }}
          persist-credentials: false
      # リポジトリが固定したツール (bun・uv・task など) を入れる。トークンを作った後、PR のコードを動かす前に行う
      - name: ツールを入れる (mise)
        if: steps.round.outputs.run == 'true' && hashFiles('mise.toml', '.mise.toml') != ''
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - if: steps.round.outputs.run == 'true' && hashFiles('mise.toml', '.mise.toml') == '' && hashFiles('bun.lock', 'bun.lockb') != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - if: steps.round.outputs.run == 'true' && hashFiles('mise.toml', '.mise.toml') == '' && hashFiles('uv.lock') != ''
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - if: steps.round.outputs.run == 'true'
        uses: theindiehacker/autopilot-plugin/actions/claude@{{AUTOPILOT_REF}}
        with:
          mode: fix
          github-token: ${{ steps.app.outputs.token }}
          app-slug: ${{ steps.app.outputs.app-slug }}
          reviewer-bots: {{REVIEWER_BOTS}}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          pr: ${{ steps.round.outputs.pr }}

  # Claude の Bash が動いた job では、秘密鍵を使わない。ready は別の job で行う
  ready:
    needs: fix
    if: needs.fix.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: theindiehacker/autopilot-plugin/actions/autopilot@{{AUTOPILOT_REF}}
        with:
          command: ready
          app-id: ${{ secrets.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}
          slack-webhook-url: ${{ secrets.AUTOPILOT_SLACK_WEBHOOK_URL }}

  sweep:
    # sweep が起こす workflow_dispatch (pr 付き) では動かさない。動かすと終わらない
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && inputs.pr == '')
    runs-on: ubuntu-latest
    steps:
      - uses: theindiehacker/autopilot-plugin/actions/autopilot@{{AUTOPILOT_REF}}
        with:
          command: sweep
          app-id: ${{ secrets.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}
          slack-webhook-url: ${{ secrets.AUTOPILOT_SLACK_WEBHOOK_URL }}

  deploy:
    if: >-
      github.event_name == 'pull_request_target'
      && github.event.action == 'closed'
      && github.event.pull_request.merged == true
      && github.event.pull_request.base.ref == github.event.repository.default_branch
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.event.pull_request.head.ref, 'autopilot/')
    runs-on: ubuntu-latest
    concurrency:
      group: autopilot-deploy
      cancel-in-progress: false
    steps:
      - uses: theindiehacker/autopilot-plugin/actions/autopilot@{{AUTOPILOT_REF}}
        with:
          command: deploy
          profile: deploy
          app-id: ${{ secrets.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}
          slack-webhook-url: ${{ secrets.AUTOPILOT_SLACK_WEBHOOK_URL }}
