# .github/workflows/claude-code-review.yml
# Claude のレビューが無いリポジトリに置く。判定は claude[bot] が出す
name: claude-code-review

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

# 書き込みの権限は、job にだけ与える
permissions:
  contents: read

jobs:
  review:
    # 呼び出される側にも同じ条件がある。ここでも絞り、権限のある人のコメント以外では動かさない。
    # コメントで起動するときの合図 (/code-review) は、review.command に合わせる
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft)
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && contains(github.event.comment.body, '/code-review')
        && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    permissions:
      contents: read
      actions: read
      pull-requests: write
      issues: write
      id-token: write
    uses: theindiehacker/github-workflows/.github/workflows/claude-code-review.yml@0ff8b0c0f329c467cfb0f8c52f8b20d36e5228df # v4.0.1
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
