# .github/workflows/claude-code-review.yml
# Claude のレビューが無いリポジトリに置く。判定は claude[bot] が出す
name: claude-code-review

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

# write は呼び出す側の job で与える
permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    uses: theindiehacker/github-workflows/.github/workflows/claude-code-review.yml@0ff8b0c0f329c467cfb0f8c52f8b20d36e5228df # v4.0.1
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
