# .github/workflows/rollback.yml (Cloud Run)
# トラフィックを、最後に正常だったリビジョンに戻す。デプロイのワークフローと同じサービス・リージョン・認証にする
# 正常 = Ready で、いま配信中でなく、AUTOPILOT_BAD_REVISIONS (Actions の変数) に無いもののうち、いちばん新しいもの。
# トラフィックのタグは作らない (タグは、そのリビジョンに届く公開の URL になるため)
name: rollback

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  SERVICE: "{{SERVICE}}"
  REGION: "{{REGION}}"

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # デプロイのワークフローの認証の step をそのまま写す (Workload Identity Federation)
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: "{{WORKLOAD_IDENTITY_PROVIDER}}"
          service_account: "{{SERVICE_ACCOUNT}}"
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      # 戻したあと、戻す元を変数に記録する。変数を書く権限だけの App のトークンを使う
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}
          permission-variables: write
      - name: 最後に正常だったリビジョンに戻す
        shell: bash
        env:
          BAD_REVISIONS: ${{ vars.AUTOPILOT_BAD_REVISIONS }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          desc="$(gcloud run services describe "$SERVICE" --region "$REGION" --format json)"

          # 前の版のひな形が付けたタグを消す (タグは、そのリビジョンに届く公開の URL になる)
          tags="$(jq -r '[.status.traffic[] | (.tag // "") | select(startswith("autopilot-bad-"))] | unique | join(",")' <<<"$desc")"
          if [ -n "$tags" ]; then
            gcloud run services update-traffic "$SERVICE" --region "$REGION" --remove-tags "$tags"
          fi

          serving="$(jq -r '[.status.traffic[] | select(.percent > 0)] | sort_by(-.percent) | map(.revisionName) | join("\n")' <<<"$desc")"
          current="$(head -n1 <<<"$serving")"
          if [ -z "$current" ]; then
            echo "::error::いま配信中のリビジョンが分かりません"
            exit 1
          fi

          # Ready なリビジョンを新しい順に並べ、配信中と記録済みの悪いものを除いて、先頭を選ぶ
          revisions="$(gcloud run revisions list \
            --service "$SERVICE" --region "$REGION" \
            --sort-by '~metadata.creationTimestamp' --format json)"
          candidate="$(jq -r --arg bad "$BAD_REVISIONS" --arg serving "$serving" '
            ($bad | split(",")) + ($serving | split("\n")) as $skip
            | [.[] | select(any(.status.conditions[]?; .type == "Ready" and .status == "True"))
                | .metadata.name | select(. as $n | $skip | index($n) | not)]
            | first // empty' <<<"$revisions")"
          if [ -z "$candidate" ]; then
            echo "::error::戻し先にできる正常なリビジョンがありません (Ready で、配信中でも AUTOPILOT_BAD_REVISIONS にも無いもの)"
            exit 1
          fi
          echo "戻す元: $current / 戻し先: $candidate"

          gcloud run services update-traffic "$SERVICE" \
            --region "$REGION" --to-revisions "${candidate}=100"

          # 戻せたあとで、戻す元を記録する。次に戻すときの候補から外すため
          if [ -n "$BAD_REVISIONS" ]; then new="${BAD_REVISIONS},${current}"; else new="$current"; fi
          if ! out="$(gh api -X PATCH "repos/${GH_REPO}/actions/variables/AUTOPILOT_BAD_REVISIONS" -f value="$new" 2>&1)"; then
            if grep -q "Not Found" <<<"$out"; then
              gh api -X POST "repos/${GH_REPO}/actions/variables" -f name=AUTOPILOT_BAD_REVISIONS -f value="$new"
            else
              echo "$out" >&2
              exit 1
            fi
          fi
