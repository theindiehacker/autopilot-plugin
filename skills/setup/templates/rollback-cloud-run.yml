# .github/workflows/rollback.yml (Cloud Run)
# トラフィックを、最後に正常だったリビジョンに戻す。デプロイのワークフローと同じサービス・リージョン・認証にする
# 正常 = Ready で、いま配信中でなく、`autopilot-bad-` のタグが付いていないもののうち、いちばん新しいもの
name: rollback

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  SERVICE: "{{SERVICE}}"
  REGION: "{{REGION}}"

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # デプロイのワークフローの認証の step をそのまま写す (Workload Identity Federation)
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: "{{WORKLOAD_IDENTITY_PROVIDER}}"
          service_account: "{{SERVICE_ACCOUNT}}"
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: 最後に正常だったリビジョンに戻す
        run: |
          desc="$(gcloud run services describe "$SERVICE" --region "$REGION" --format json)"
          # 配信中のリビジョンと、前に戻した元として印を付けたリビジョン
          serving="$(jq -r '[.status.traffic[] | select(.percent > 0)] | sort_by(-.percent) | .[].revisionName // empty' <<<"$desc")"
          bad="$(jq -r '.status.traffic[] | select((.tag // "") | startswith("autopilot-bad-")) | .revisionName' <<<"$desc")"
          current="$(head -n1 <<<"$serving")"
          # Ready なリビジョンを新しい順に並べ、配信中と印付きを除いて先頭を選ぶ
          candidate="$(gcloud run revisions list \
            --service "$SERVICE" --region "$REGION" \
            --sort-by '~metadata.creationTimestamp' --format json \
            | jq -r '.[] | select(any(.status.conditions[]?; .type == "Ready" and .status == "True")) | .metadata.name' \
            | grep -vxF -e "$serving" -e "$bad" | head -n1 || true)"
          if [ -z "$candidate" ] || [ -z "$current" ]; then
            echo "::error::戻し先にできる正常なリビジョンがありません (Ready で、配信中でも autopilot-bad- 付きでもないもの)"
            exit 1
          fi
          echo "戻す元: $current / 戻し先: $candidate"
          # 戻す元に印を付ける (トラフィックは 0%)。次に戻すときの候補から外すため
          gcloud run services update-traffic "$SERVICE" --region "$REGION" \
            --update-tags "autopilot-bad-$(date -u +%Y%m%d%H%M%S)=${current}"
          gcloud run services update-traffic "$SERVICE" \
            --region "$REGION" --to-revisions "${candidate}=100"
