name: autopilot claude
description: QA と対応を、claude-code-action で行う。プロンプトは skills/<mode>/SKILL.md から読む
inputs:
  mode:
    description: qa か fix
    required: true
  app-id:
    description: GitHub App の ID
    required: true
  private-key:
    description: GitHub App の秘密鍵
    required: true
  claude-code-oauth-token:
    description: Claude Code の OAuth トークン (anthropic-api-key のどちらか一方でよい)
    required: false
    default: ""
  anthropic-api-key:
    description: Anthropic の API キー
    required: false
    default: ""
  pr:
    description: 対象の PR の番号
    required: false
    default: ""
  reviewer-bots:
    description: claude-code-action が動かしてよいボットのログイン (カンマ区切り)。App 自身は常に入る
    required: false
    default: claude
runs:
  using: composite
  steps:
    - id: prompt
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        PR: ${{ inputs.pr }}
        SKILLS: ${{ github.action_path }}/../../skills
      run: |
        case "$MODE" in
          qa) tools='Bash,Read,Write,Glob,Grep,mcp__playwright__*' ;;
          fix) tools='Bash,Read,Edit,Write,Glob,Grep' ;;
          *) echo "mode は qa か fix にしてください: $MODE" >&2; exit 1 ;;
        esac
        {
          echo "prompt<<AUTOPILOT_PROMPT_EOF"
          # 先頭の frontmatter (--- から ---) を除く
          awk 'NR == 1 && $0 == "---" { skip = 1; next } skip && $0 == "---" { skip = 0; next } !skip' "$SKILLS/$MODE/SKILL.md"
          if [ -n "$PR" ]; then
            echo
            echo "対象の PR は #$PR です。"
          fi
          echo "AUTOPILOT_PROMPT_EOF"
          echo "args<<AUTOPILOT_ARGS_EOF"
          printf '%s' "--allowedTools \"$tools\""
          if [ "$MODE" = qa ]; then
            # Playwright の MCP サーバーは版を固定する
            printf ' %s' "--mcp-config '{\"mcpServers\":{\"playwright\":{\"command\":\"npx\",\"args\":[\"-y\",\"@playwright/mcp@0.0.85\",\"--headless\"]}}}'"
            printf ' %s' "--json-schema '{\"type\":\"object\",\"properties\":{\"passed\":{\"type\":\"boolean\"},\"summary\":{\"type\":\"string\"}},\"required\":[\"passed\",\"summary\"]}'"
          fi
          echo
          echo "AUTOPILOT_ARGS_EOF"
        } >> "$GITHUB_OUTPUT"
    # 権限は、モードで要るものだけにする
    - id: app-qa
      if: inputs.mode == 'qa'
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        permission-contents: write
        permission-pull-requests: write
        permission-issues: write
    - id: app-fix
      if: inputs.mode == 'fix'
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        permission-contents: write
        permission-pull-requests: write
        permission-issues: write
        permission-actions: read
    - id: claude
      uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
      with:
        github_token: ${{ steps.app-qa.outputs.token || steps.app-fix.outputs.token }}
        # App が起こした実行 (push・ready・sweep) と、レビュアーのボットを通す
        allowed_bots: ${{ steps.app-qa.outputs.app-slug || steps.app-fix.outputs.app-slug }}[bot],${{ inputs.reviewer-bots }}
        claude_code_oauth_token: ${{ inputs.claude-code-oauth-token }}
        anthropic_api_key: ${{ inputs.anthropic-api-key }}
        prompt: ${{ steps.prompt.outputs.prompt }}
        claude_args: ${{ steps.prompt.outputs.args }}
    - if: inputs.mode == 'qa'
      shell: bash
      env:
        RESULT: ${{ steps.claude.outputs.structured_output }}
      run: |
        passed=$(printf '%s' "$RESULT" | jq -r '.passed') || passed=""
        # AI の文章は標準出力に出さず、ジョブの要約に書く
        {
          echo "### autopilot QA"
          printf '%s\n' "$(printf '%s' "$RESULT" | jq -r '.summary // ""' 2>/dev/null)"
        } >> "$GITHUB_STEP_SUMMARY"
        if [ "$passed" != "true" ]; then
          echo "::error::QA が通りませんでした。ジョブの要約を見てください (passed=${passed:-不明})"
          exit 1
        fi
