name: autopilot claude
description: QA と対応を、claude-code-action で行う。プロンプトは skills/<mode>/SKILL.md から読む
inputs:
  mode:
    description: qa か fix
    required: true
  github-token:
    description: 先に作った GitHub App のトークン (PR のコードを動かす前に作る。秘密鍵はこの action に渡さない)
    required: true
  app-slug:
    description: GitHub App の slug (create-github-app-token の app-slug)
    required: true
  claude-code-oauth-token:
    description: Claude Code の OAuth トークン (anthropic-api-key のどちらか一方でよい)
    required: false
    default: ""
  anthropic-api-key:
    description: Anthropic の API キー
    required: false
    default: ""
  pr:
    description: 対象の PR の番号
    required: false
    default: ""
  reviewer-bots:
    description: claude-code-action が動かしてよいボットのログイン (カンマ区切り)。App 自身は常に入る
    required: false
    default: claude
  mcp-servers:
    description: 'QA の Claude に足す MCP サーバー。Claude Code の mcpServers と同じ形の JSON の object (例: {"app":{"type":"http","url":"http://127.0.0.1:8002/mcp"}})。mode が qa のときだけ使う'
    required: false
    default: "{}"
runs:
  using: composite
  steps:
    - id: prompt
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        PR: ${{ inputs.pr }}
        MCP_SERVERS: ${{ inputs.mcp-servers }}
        SKILLS: ${{ github.action_path }}/../../skills
      run: |
        case "$MODE" in
          qa)
            tools='Bash,Read,Write,Glob,Grep,mcp__playwright__*'
            # Playwright の MCP サーバーは版を固定する
            playwright='{"playwright":{"command":"npx","args":["-y","@playwright/mcp@0.0.85","--headless"]}}'
            if ! printf '%s' "$MCP_SERVERS" | jq -e 'type == "object"' > /dev/null 2>&1; then
              echo "mcp-servers は JSON の object にしてください" >&2
              exit 1
            fi
            if ! printf '%s' "$MCP_SERVERS" | jq -e 'keys | all(test("\\A[A-Za-z0-9_-]+\\z")) and (index("playwright") | not)' > /dev/null 2>&1; then
              echo "mcp-servers の名前は英数字・_・- だけにし、playwright は使わないでください" >&2
              exit 1
            fi
            for name in $(printf '%s' "$MCP_SERVERS" | jq -r 'keys[]'); do
              tools="$tools,mcp__${name}__*"
            done
            mcp_config=$(jq -cn --argjson playwright "$playwright" --argjson extra "$MCP_SERVERS" '{mcpServers: ($playwright + $extra)}')
            # --mcp-config の値はシングルクォートで囲むため、' が入ると引数の区切りが崩れる
            case "$mcp_config" in
              *"'"*) echo "mcp-servers に ' は使えません" >&2; exit 1 ;;
            esac
            ;;
          fix) tools='Bash,Read,Edit,Write,Glob,Grep' ;;
          *) echo "mode は qa か fix にしてください: $MODE" >&2; exit 1 ;;
        esac
        {
          echo "prompt<<AUTOPILOT_PROMPT_EOF"
          # 先頭の frontmatter (--- から ---) を除く
          awk 'NR == 1 && $0 == "---" { skip = 1; next } skip && $0 == "---" { skip = 0; next } !skip' "$SKILLS/$MODE/SKILL.md"
          if [ -n "$PR" ]; then
            echo
            echo "対象の PR は #$PR です。"
          fi
          echo "AUTOPILOT_PROMPT_EOF"
          echo "args<<AUTOPILOT_ARGS_EOF"
          printf '%s' "--allowedTools \"$tools\""
          # 環境変数や /proc から秘密を出すコマンドを断る (完全な防ぎではない)
          printf ' %s' "--disallowedTools \"Bash(env:*),Bash(printenv:*),Bash(set),Bash(export -p),Bash(cat /proc/*)\""
          if [ "$MODE" = qa ]; then
            printf ' %s' "--mcp-config '$mcp_config'"
            printf ' %s' "--json-schema '{\"type\":\"object\",\"properties\":{\"passed\":{\"type\":\"boolean\"},\"summary\":{\"type\":\"string\"}},\"required\":[\"passed\",\"summary\"]}'"
          fi
          echo
          echo "AUTOPILOT_ARGS_EOF"
        } >> "$GITHUB_OUTPUT"
    - id: claude
      uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
      with:
        github_token: ${{ inputs.github-token }}
        # App が起こした実行 (push・ready・sweep) と、レビュアーのボットを通す
        allowed_bots: ${{ inputs.app-slug }}[bot],${{ inputs.reviewer-bots }}
        claude_code_oauth_token: ${{ inputs.claude-code-oauth-token }}
        anthropic_api_key: ${{ inputs.anthropic-api-key }}
        prompt: ${{ steps.prompt.outputs.prompt }}
        claude_args: ${{ steps.prompt.outputs.args }}
    - if: inputs.mode == 'qa'
      shell: bash
      env:
        RESULT: ${{ steps.claude.outputs.structured_output }}
      run: |
        passed=$(printf '%s' "$RESULT" | jq -r '.passed') || passed=""
        # AI の文章は標準出力に出さず、ジョブの要約に書く
        {
          echo "### autopilot QA"
          printf '%s\n' "$(printf '%s' "$RESULT" | jq -r '.summary // ""' 2>/dev/null)"
        } >> "$GITHUB_STEP_SUMMARY"
        if [ "$passed" != "true" ]; then
          echo "::error::QA が通りませんでした。ジョブの要約を見てください (passed=${passed:-不明})"
          exit 1
        fi
