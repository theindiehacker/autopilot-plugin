name: autopilot
description: autopilot の AI を使わない処理 (automation/src/cli.ts のコマンド) を、GitHub App のトークンで動かす
inputs:
  command:
    description: cli.ts のコマンド (sweep)
    required: true
  app-id:
    description: GitHub App の ID
    required: true
  private-key:
    description: GitHub App の秘密鍵
    required: true
runs:
  using: composite
  steps:
    # PR のコードは動かさない。権限は、要るものだけにする
    - id: app
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        permission-contents: read
        permission-pull-requests: write
        permission-issues: write
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: ${{ github.action_path }}/../../automation/package.json
    - id: cli
      shell: bash
      # プラグイン側の automation で動かす。PR の checkout の bunfig や .env を読まないため
      working-directory: ${{ github.action_path }}/../../automation
      env:
        AUTOPILOT_COMMAND: ${{ inputs.command }}
        GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        AUTOPILOT_APP_SLUG: ${{ steps.app.outputs.app-slug }}
      run: bun run src/cli.ts "$AUTOPILOT_COMMAND"
