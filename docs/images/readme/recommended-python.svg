<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="226" viewBox="0 0 1200 226">
<style>
.t{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans CJK JP','Noto Sans JP','Yu Gothic',Meiryo,'Segoe UI',Helvetica,Arial,sans-serif}
.card{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.shine{animation:sweep 7s ease-in-out infinite}
@keyframes sweep{0%,55%{transform:translateX(-500px)}100%{transform:translateX(1700px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<clipPath id="clip"><rect width="1200" height="226" rx="28"/></clipPath>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".07"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#FFFFFF" fill-opacity=".06"/></pattern>
<symbol id="i-zap" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></symbol><symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></symbol>
</defs>
<g clip-path="url(#clip)">
<rect width="1200" height="226" fill="#07070D"/>
<rect width="1200" height="226" fill="url(#dots)"/>
<g transform="translate(24 24)"><g class="card" style="animation-delay:0.00s"><rect width="1152" height="84" rx="22" fill="#0E0E17"/><rect x=".5" y=".5" width="1151" height="83" rx="21.5" fill="none" stroke="#FFFFFF" stroke-opacity=".1"/><use href="#i-zap" x="24" y="24" width="36" height="36" stroke="#FACC15"/><text x="78" y="54" font-size="32" font-weight="700" fill="#FAFAFA" class="t">superpowers</text><text x="420" y="54" font-size="32" font-weight="500" fill="#C4C4CC" class="t">設計・実装計画・TDD・サブエージェント開発</text></g></g>
<g transform="translate(24 118)"><g class="card" style="animation-delay:0.08s"><rect width="1152" height="84" rx="22" fill="#0E0E17"/><rect x=".5" y=".5" width="1151" height="83" rx="21.5" fill="none" stroke="#FFFFFF" stroke-opacity=".1"/><use href="#i-shield" x="24" y="24" width="36" height="36" stroke="#34D399"/><text x="78" y="54" font-size="32" font-weight="700" fill="#FAFAFA" class="t">security-guidance</text><text x="420" y="54" font-size="32" font-weight="500" fill="#C4C4CC" class="t">編集時の警告と diff・commit のレビュー</text></g></g>
<g transform="skewX(-20)"><rect class="shine" x="0" y="0" width="260" height="226" fill="url(#sheen)"/></g>
</g>
</svg>
